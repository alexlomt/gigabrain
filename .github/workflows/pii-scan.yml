name: pii-scan
# Hard rule: block any commit/PR that introduces real personal data.
# This is server-side and cannot be bypassed by local git config.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: No personal data
        run: node scripts/check-no-pii.mjs
