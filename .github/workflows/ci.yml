name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'upgrade/**'
  pull_request:

permissions:
  contents: read

jobs:
  node-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup minimum supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Test minimum-runtime contract
        run: node tests/run-all.js --filter plugin-runtime,runtime-guard

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Test
        run: node tests/run-all.js

  private-compatibility-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.22.0'
            npm: '10.9.4'
          - node: '26.7.0'
            npm: '12.0.2'
    steps:
      - name: Checkout full source-first history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact compatibility Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Setup exact compatibility npm
        env:
          EXPECTED_NODE: ${{ matrix.node }}
          EXPECTED_NPM: ${{ matrix.npm }}
        run: |
          npm install --global "npm@$EXPECTED_NPM"
          test "$(node --version)" = "v$EXPECTED_NODE"
          test "$(npm --version)" = "$EXPECTED_NPM"

      - name: Setup exact Memory API Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10.12'

      - name: Build Task 11 production Python bridge
        run: |
          python -m venv .venv-ci-prod
          .venv-ci-prod/bin/python -m pip install --disable-pip-version-check \
            --require-hashes \
            --requirement memory_api/requirements-prod-py310-linux-x86_64.lock
          echo "GIGABRAIN_TASK11_PYTHON=$PWD/.venv-ci-prod/bin/python" >> "$GITHUB_ENV"

      - name: Enforce source-first divergence
        run: >-
          node scripts/check-source-first-divergence.mjs
          --base ef624f97cc616a9e00b6df653eded455fbd30e01
          --map config/migration/source-first-port-map.json

      - name: Install compatibility dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run full private compatibility inventory
        run: node tests/run-all.js

      - name: Scan npm pack inventory
        run: node scripts/check-no-pii.mjs

  private-compatibility-python-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup exact Memory API Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10.12'

      - name: Verify exact Python
        run: test "$(python --version)" = "Python 3.10.12"

      - name: Build hash-locked production environment
        run: |
          python -m venv .venv-ci-prod
          .venv-ci-prod/bin/python -m pip install --disable-pip-version-check \
            --require-hashes \
            --requirement memory_api/requirements-prod-py310-linux-x86_64.lock

      - name: Test Memory API security and projection on Python 3.10
        run: >-
          .venv-ci-prod/bin/python -m unittest -v
          tests.memory_api_security_test
          tests.memory_api_projection_test

      - name: Build separate hash-locked development environment
        run: |
          python -m venv .venv-ci-dev
          .venv-ci-dev/bin/python -m pip install --disable-pip-version-check \
            --require-hashes \
            --requirement memory_api/requirements-dev.lock

      - name: Ruff Memory API and tests
        run: >-
          .venv-ci-dev/bin/ruff check
          memory_api/app.py
          tests/memory_api_security_test.py
          tests/memory_api_projection_test.py

      - name: Audit production lock
        run: >-
          .venv-ci-dev/bin/pip-audit
          --requirement memory_api/requirements-prod-py310-linux-x86_64.lock
          --require-hashes
          --disable-pip
          --progress-spinner off
