name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  node-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup minimum supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Test minimum-runtime contract
        run: node tests/run-all.js --filter plugin-runtime,runtime-guard

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Test
        run: node tests/run-all.js

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Memory API dependencies
        run: python -m pip install --disable-pip-version-check -r memory_api/requirements.txt

      - name: Test Memory API security
        run: python -m unittest tests/memory_api_security_test.py
